name: Bug report
description: Something in Trawl behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The single most useful thing you can give me is **steps that
        reproduce it on a clean install** — a bug I can trigger is a bug I can fix, and one I
        cannot is mostly guesswork.

        If a *site* stopped working rather than the app, use the **Site support** template instead.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before reporting
      options:
        - label: I am running the latest [Trawl release](https://github.com/uukjtisa/trawl/releases/latest).
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is a fault in Trawl itself, not a site that stopped working (that goes in the Site support template).
          required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
      placeholder: |
        Tapping Audio in the configure sheet opens the format list, which contains no audio
        formats, so there is no way to continue.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Exact steps to reproduce
      description: |
        Numbered, from a cold start of the app. Include the setting values you are using if they
        differ from the defaults — most "cannot reproduce" outcomes come down to one toggle.
      placeholder: |
        1. Cold start Trawl (force stop it first).
        2. Paste <a link — see the note about links below>.
        3. Tap Download.
        4. In the configure sheet, choose Audio.
        5. Tap Download. Observe: the format list opens and lists only MP4.

        Happens every time / about 1 time in 5 / only after a download has finished.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link it happens with
      description: |
        Optional, and **omit it entirely if it is adult or otherwise sensitive** — describe the
        kind of post instead ("an age-restricted clip on X"). A bug that only needs *a* link of
        some type does not need *your* link.
    validations:
      required: false

  - type: textarea
    id: device
    attributes:
      label: Device and version
      description: Settings ▸ About shows the Trawl and yt-dlp versions.
      value: |
        - Trawl version:
        - yt-dlp version:
        - Device and model:
        - Android version:
        - ROM (stock / MIUI / EMUI / HyperOS / LineageOS / ...):
        - Installed from (GitHub release / built it myself):
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error report or log
      description: |
        If an error card appeared, tap it to copy the report and paste it here. Settings ▸
        Troubleshooting can also export a log.

        **Check it before posting** — logs can contain the URLs you downloaded and your file
        paths. Redact anything you would not put in a public issue.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots and screen recordings are very welcome.
    validations:
      required: false
